<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D47A1"/>
      <stop offset="0.55" stop-color="#1565C0"/>
      <stop offset="1" stop-color="#00BCD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#062a45" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- soft beacon glow behind the shelter pin -->
  <circle cx="512" cy="392" r="330" fill="url(#glow)"/>

  <!-- back wave (depth) -->
  <path d="M0,1024 L0,712 C150,792 330,792 446,726 C534,676 612,684 676,652 C792,596 904,640 1024,656 L1024,1024 Z"
        fill="#FFFFFF" opacity="0.26"/>

  <!-- front wave with a small crest curl on the right -->
  <path d="M0,1024 L0,784 C176,712 322,712 432,772 C500,808 582,800 628,740 C676,678 742,676 792,706 C842,734 884,724 902,694 C944,636 1002,660 1024,724 L1024,1024 Z"
        fill="#FFFFFF"/>

  <!-- safe-shelter pin (Material place-pin path, scaled) -->
  <g filter="url(#soft)" transform="translate(224,172) scale(24)">
    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#4CAF50"/>
    <circle cx="12" cy="9" r="2.7" fill="#FFFFFF"/>
  </g>
</svg>
